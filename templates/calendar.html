{% extends "base.html" %}
{% block title %}Vedic Calendar — PyJHora{% endblock %}
{% block content %}
<h1>📆 Vedic Calendar</h1>
<p style="color:var(--muted);margin-bottom:1rem">Click any date to load its full Panchanga</p>

<div class="card">
  <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem">
    <button class="btn btn-primary btn-sm" onclick="changeMonth(-1)">← Prev</button>
    <span id="monthLabel" style="font-size:1.1rem;font-weight:700;color:var(--accent)"></span>
    <button class="btn btn-primary btn-sm" onclick="changeMonth(1)">Next →</button>
    <button class="btn btn-cyan btn-sm" onclick="goToday()">Today</button>
  </div>

  <div class="form-grid" style="margin-bottom:.8rem">
    <div><label>Location</label><input type="text" id="calPlace" value="Jaipur,IN"></div>
    <div><label>Latitude</label><input type="number" id="calLat" value="26.9124" step="0.0001"></div>
    <div><label>Longitude</label><input type="number" id="calLon" value="75.7873" step="0.0001"></div>
    <div><label>Timezone</label><input type="number" id="calTz" value="5.5" step="0.5"></div>
  </div>

  <div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--border);border-radius:.5rem;overflow:hidden">
    <div style="background:#11112a;color:var(--muted);text-align:center;padding:.4rem;font-size:.75rem">Sun</div>
    <div style="background:#11112a;color:var(--muted);text-align:center;padding:.4rem;font-size:.75rem">Mon</div>
    <div style="background:#11112a;color:var(--muted);text-align:center;padding:.4rem;font-size:.75rem">Tue</div>
    <div style="background:#11112a;color:var(--muted);text-align:center;padding:.4rem;font-size:.75rem">Wed</div>
    <div style="background:#11112a;color:var(--muted);text-align:center;padding:.4rem;font-size:.75rem">Thu</div>
    <div style="background:#11112a;color:var(--muted);text-align:center;padding:.4rem;font-size:.75rem">Fri</div>
    <div style="background:#11112a;color:var(--muted);text-align:center;padding:.4rem;font-size:.75rem">Sat</div>
  </div>
</div>

<!-- Detail modal -->
<div id="overlay" style="display:none;position:fixed;inset:0;background:#00000080;z-index:1000" onclick="closeModal()"></div>
<div id="modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1001;width:min(90vw,450px);background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:1.5rem">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
    <h2 id="modalDate" style="margin:0"></h2>
    <button onclick="closeModal()" style="background:none;border:none;color:var(--text);font-size:1.5rem;cursor:pointer">×</button>
  </div>
  <div id="modalContent"><span class="spinner"></span> Loading…</div>
</div>
{% endblock %}
{% block extra_js %}
<script>
let cy=new Date().getFullYear(), cm=new Date().getMonth();
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

function buildCal(){
  document.getElementById('monthLabel').textContent=`${MONTHS[cm]} ${cy}`;
  const grid=document.getElementById('calGrid');
  // Remove old day cells (keep 7 headers)
  while(grid.children.length>7) grid.removeChild(grid.lastChild);

  const first=new Date(cy,cm,1).getDay();
  const daysInMonth=new Date(cy,cm+1,0).getDate();
  const prevDays=new Date(cy,cm,0).getDate();
  const today=new Date();

  // Previous month trailing
  for(let i=first-1;i>=0;i--){
    const d=prevDays-i;
    const cell=makeCell(cy,cm-1,d,true);
    grid.appendChild(cell);
  }
  // Current month
  for(let d=1;d<=daysInMonth;d++){
    const isToday=today.getFullYear()===cy&&today.getMonth()===cm&&today.getDate()===d;
    const cell=makeCell(cy,cm,d,false,isToday);
    grid.appendChild(cell);
  }
  // Next month leading
  const total=grid.children.length-7;
  const remain=total%7?7-(total%7):0;
  for(let d=1;d<=remain;d++){
    const cell=makeCell(cy,cm+1,d,true);
    grid.appendChild(cell);
  }
}

function makeCell(y,m,d,other,isToday=false){
  const div=document.createElement('div');
  div.style.cssText=`background:${other?'#0d0d1a':isToday?'#2e2e55':'var(--card)'};min-height:80px;padding:.3rem .4rem;cursor:${other?'default':'pointer'};position:relative`;
  const dn=document.createElement('div');
  dn.textContent=d;
  dn.style.cssText=`font-size:.85rem;font-weight:700;color:${isToday?'var(--accent)':other?'var(--border)':'var(--text)'}`;
  div.appendChild(dn);
  if(!other){
    const realM=((m%12)+12)%12;
    const realY=y+(m<0?-1:m>11?1:0);
    div.onclick=()=>openModal(realY,realM+1,d);
  }
  return div;
}

async function openModal(y,m,d){
  document.getElementById('overlay').style.display='block';
  document.getElementById('modal').style.display='block';
  document.getElementById('modalDate').textContent=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  document.getElementById('modalContent').innerHTML='<span class="spinner"></span> Loading panchanga…';

  const payload={
    date:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,
    time:'12:00:00',
    place:document.getElementById('calPlace').value,
    latitude:+document.getElementById('calLat').value,
    longitude:+document.getElementById('calLon').value,
    timezone:+document.getElementById('calTz').value
  };

  const data=await api('/api/panchanga',payload);
  if(data.error){document.getElementById('modalContent').innerHTML=`<div class="alert alert-err">⚠ ${data.error}</div>`;return;}

  const items=[['Day',data.vaara],['Tithi',data.tithi],['Nakshatra',data.nakshatra],['Yoga',data.yoga],['Karana',data.karana],['Rasi',data.rasi],['Sunrise',data.sunrise],['Sunset',data.sunset]];
  document.getElementById('modalContent').innerHTML=`<div class="panch-grid">
    ${items.map(([l,v])=>`<div class="panch-item"><div class="label">${l}</div><div class="value" style="font-size:.85rem">${v||'N/A'}</div></div>`).join('')}
  </div>`;
}

function closeModal(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('modal').style.display='none';
}

function changeMonth(d){
  cm+=d; if(cm>11){cm=0;cy++;} else if(cm<0){cm=11;cy--;}
  buildCal();
}

function goToday(){
  const t=new Date(); cy=t.getFullYear(); cm=t.getMonth(); buildCal();
}

buildCal();
</script>
{% endblock %}
