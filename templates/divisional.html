{% extends "base.html" %}
{% block title %}Divisional Charts — PyJHora{% endblock %}
{% block content %}
<h1>📊 Divisional Charts (D1–D60)</h1>

<div class="card">
  <h2>Birth Details</h2>
  <div class="form-grid">
    <div><label>Date of Birth</label><input type="date" id="date" value="1997-10-03"></div>
    <div><label>Time of Birth</label><input type="time" id="time" value="11:40" step="1"></div>
    <div><label>Place</label><input type="text" id="place" value="Jaipur,IN"></div>
    <div><label>Latitude</label><input type="number" id="latitude" value="26.9124" step="0.0001"></div>
    <div><label>Longitude</label><input type="number" id="longitude" value="75.7873" step="0.0001"></div>
    <div><label>Timezone (hrs)</label><input type="number" id="timezone" value="5.5" step="0.5"></div>
  </div>
  <div class="form-grid" style="margin-top:.5rem">
    <div>
      <label>Division</label>
      <select id="division">
        <option value="all">All Vargas</option>
        <option value="D1">D1 — Rasi</option>
        <option value="D2">D2 — Hora</option>
        <option value="D3">D3 — Drekkana</option>
        <option value="D4">D4 — Chaturthamsha</option>
        <option value="D7">D7 — Saptamsha</option>
        <option value="D9">D9 — Navamsa</option>
        <option value="D10">D10 — Dasamsha</option>
        <option value="D12">D12 — Dwadashamsha</option>
        <option value="D16">D16 — Shodashamsha</option>
        <option value="D20">D20 — Vimshamsha</option>
        <option value="D24">D24 — Chaturvimshamsha</option>
        <option value="D27">D27 — Saptavimshamsha</option>
        <option value="D30">D30 — Trimshamsha</option>
        <option value="D40">D40 — Khavedamsha</option>
        <option value="D45">D45 — Akshavedamsha</option>
        <option value="D60">D60 — Shashtiamsha</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="calculate()">
      <span class="spinner" id="spin" style="display:none"></span> Calculate Divisionals
    </button>
  </div>
  <div id="errBox"></div>
</div>

<div id="results" style="display:none">
  <div class="card">
    <h2>🪐 Base Positions (D1)</h2>
    <div id="baseTable"></div>
  </div>
  <div id="vargaSection"></div>
</div>
{% endblock %}
{% block extra_js %}
<script>
const PS={'Sun':'☀','Moon':'🌙','Mars':'♂','Mercury':'☿','Jupiter':'♃','Venus':'♀','Saturn':'♄','Rahu':'☊','Ketu':'☋','Lagna':'↑'};
const VARGA_DESC={D1:'Rasi — Body & Soul',D2:'Hora — Wealth',D3:'Drekkana — Siblings',D4:'Chaturthamsha — Fortune',D7:'Saptamsha — Children',D9:'Navamsa — Marriage',D10:'Dasamsha — Career',D12:'Dwadashamsha — Parents',D16:'Shodashamsha — Conveyances',D20:'Vimshamsha — Spirituality',D24:'Chaturvimshamsha — Education',D27:'Saptavimshamsha — Strength',D30:'Trimshamsha — Misfortunes',D40:'Khavedamsha — Auspiciousness',D45:'Akshavedamsha — Character',D60:'Shashtiamsha — Past life karma'};

async function calculate(){
  const sp=document.getElementById('spin'); sp.style.display='inline-block';
  document.getElementById('errBox').innerHTML='';
  const d=await api('/api/divisional',{
    date:document.getElementById('date').value,
    time:document.getElementById('time').value+':00',
    place:document.getElementById('place').value,
    latitude:+document.getElementById('latitude').value,
    longitude:+document.getElementById('longitude').value,
    timezone:+document.getElementById('timezone').value,
    division:document.getElementById('division').value
  });
  sp.style.display='none';
  if(d.error){document.getElementById('errBox').innerHTML=`<div class="alert alert-err">⚠ ${d.error}</div>`;return;}

  // Base table
  document.getElementById('baseTable').innerHTML=`<table>
    <tr><th>Planet</th><th>Sign</th><th>House</th><th>Lon°</th></tr>
    ${(d.base_planets||[]).map(p=>`<tr>
      <td>${PS[p.name]||''} <b>${p.name}</b></td>
      <td><span class="badge badge-info">${p.sign}</span></td>
      <td>${p.house}</td>
      <td>${(p.lon_in_sign||0).toFixed(2)}</td>
    </tr>`).join('')}
  </table>`;

  // Vargas
  const vargas=d.vargas||{};
  const sec=document.getElementById('vargaSection');
  const keys=Object.keys(vargas);
  let html='<div class="grid3">';
  keys.forEach(vName=>{
    const desc=VARGA_DESC[vName]||vName;
    const planets=vargas[vName]||{};
    html+=`<div class="card">
      <h2>${vName} <small style="font-size:.7rem;color:var(--muted)">${desc}</small></h2>
      <table>
        <tr><th>Planet</th><th>Sign</th><th>Lon°</th></tr>
        ${Object.entries(planets).map(([p,info])=>`
          <tr>
            <td>${PS[p]||''} ${p}</td>
            <td><span class="badge badge-purple">${info.sign}</span></td>
            <td>${info.longitude.toFixed(1)}</td>
          </tr>`).join('')}
      </table>
    </div>`;
  });
  html+='</div>';
  sec.innerHTML=html;

  document.getElementById('results').style.display='block';
}
</script>
{% endblock %}
