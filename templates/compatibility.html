{% extends "base.html" %}
{% block title %}Compatibility — PyJHora{% endblock %}
{% block content %}
<h1>💑 Marriage Compatibility</h1>
<p style="color:var(--muted);margin-bottom:1rem">Ashtakoota Guna Milan Analysis — 36 point system</p>

<div class="card">
  <div class="grid2">
    <div>
      <h2 style="margin-bottom:.8rem">👨 Boy's Details</h2>
      <div class="form-grid" style="grid-template-columns:1fr 1fr">
        <div>
          <label>Birth Star (Nakshatra)</label>
          <select id="boy_star"></select>
        </div>
        <div>
          <label>Pada</label>
          <select id="boy_pada">
            <option value="1">1st Pada</option>
            <option value="2">2nd Pada</option>
            <option value="3">3rd Pada</option>
            <option value="4">4th Pada</option>
          </select>
        </div>
      </div>
    </div>
    <div>
      <h2 style="margin-bottom:.8rem">👩 Girl's Details</h2>
      <div class="form-grid" style="grid-template-columns:1fr 1fr">
        <div>
          <label>Birth Star (Nakshatra)</label>
          <select id="girl_star"></select>
        </div>
        <div>
          <label>Pada</label>
          <select id="girl_pada">
            <option value="1">1st Pada</option>
            <option value="2">2nd Pada</option>
            <option value="3">3rd Pada</option>
            <option value="4">4th Pada</option>
          </select>
        </div>
      </div>
    </div>
  </div>
  <div class="btn-row" style="margin-top:.8rem">
    <button class="btn btn-primary" onclick="calculate()">
      <span class="spinner" id="spin" style="display:none"></span> Check Compatibility
    </button>
  </div>
  <div id="errBox"></div>
</div>

<div id="results" style="display:none">
  <!-- Overall score banner -->
  <div class="card" id="scoreBanner" style="text-align:center;padding:2rem">
    <div id="scoreCircle" style="font-size:3rem;font-weight:800;color:var(--accent)"></div>
    <div style="font-size:1.1rem;color:var(--muted);margin:.3rem 0" id="scoreLabel"></div>
    <div id="starNames" style="font-size:.9rem;color:var(--accent3)"></div>
  </div>

  <div class="card">
    <h2>Detailed Porutham Analysis</h2>
    <div id="poruthams"></div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
const NAKSHATRAS=['Ashwini','Bharani','Krittika','Rohini','Mrigashira','Ardra','Punarvasu','Pushya','Ashlesha','Magha','Purva Phalguni','Uttara Phalguni','Hasta','Chitra','Swati','Vishakha','Anuradha','Jyeshtha','Mula','Purva Ashadha','Uttara Ashadha','Shravana','Dhanishta','Shatabhisha','Purva Bhadrapada','Uttara Bhadrapada','Revati'];

function buildSelects(){
  ['boy_star','girl_star'].forEach((id,i)=>{
    const sel=document.getElementById(id);
    NAKSHATRAS.forEach((n,j)=>{
      const opt=document.createElement('option');
      opt.value=j+1; opt.textContent=n;
      if((i===0&&j===13)||(i===1&&j===14)) opt.selected=true;
      sel.appendChild(opt);
    });
  });
}

async function calculate(){
  const sp=document.getElementById('spin'); sp.style.display='inline-block';
  document.getElementById('errBox').innerHTML='';
  const d=await api('/api/compatibility',{
    boy_star:+document.getElementById('boy_star').value,
    boy_pada:+document.getElementById('boy_pada').value,
    girl_star:+document.getElementById('girl_star').value,
    girl_pada:+document.getElementById('girl_pada').value
  });
  sp.style.display='none';
  if(d.error){document.getElementById('errBox').innerHTML=`<div class="alert alert-err">⚠ ${d.error}</div>`;return;}

  const pct=d.overall_percentage;
  const color=pct>=75?'var(--ok)':pct>=50?'var(--warn)':'var(--err)';
  document.getElementById('scoreCircle').style.color=color;
  document.getElementById('scoreCircle').textContent=`${pct}%`;
  document.getElementById('scoreLabel').textContent=`${d.total_score} / ${d.max_total} points — ${pct>=75?'Excellent':pct>=60?'Good':pct>=40?'Average':'Poor'} Match`;
  document.getElementById('starNames').textContent=`${d.boy_star} ↔ ${d.girl_star}`;

  document.getElementById('poruthams').innerHTML=(d.results||[]).map(item=>{
    const pct2=typeof item.percentage==='number'?item.percentage:null;
    const cls=pct2===null?'badge-info':pct2>=75?'badge-ok':pct2>=50?'badge-warn':'badge-err';
    const bar=pct2!==null?`<div class="progress"><div class="progress-fill" style="width:${pct2}%;background:${pct2>=75?'var(--ok)':pct2>=50?'var(--warn)':'var(--err)'}"></div></div>`:''
    return`<div style="display:flex;align-items:center;gap:.8rem;padding:.5rem 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;font-weight:600">${item.name}</div>
      <div style="flex:2">${bar}</div>
      <span class="badge ${cls}">${item.score}/${item.max_score}</span>
    </div>`;
  }).join('');

  document.getElementById('results').style.display='block';
}

buildSelects();
</script>
{% endblock %}
