{% extends "base.html" %}
{% block title %}Horoscope — PyJHora{% endblock %}
{% block content %}
<h1>🎯 Birth Chart Analysis</h1>

<div class="card">
  <h2>Birth Details</h2>
  <div class="form-grid">
    <div><label>Date of Birth</label><input type="date" id="date" value="1997-10-03"></div>
    <div><label>Time of Birth</label><input type="time" id="time" value="11:40" step="1"></div>
    <div><label>Place</label><input type="text" id="place" value="Jaipur,IN"></div>
    <div><label>Latitude</label><input type="number" id="latitude" value="26.9124" step="0.0001"></div>
    <div><label>Longitude</label><input type="number" id="longitude" value="75.7873" step="0.0001"></div>
    <div><label>Timezone (hrs)</label><input type="number" id="timezone" value="5.5" step="0.5"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="calculate()">
      <span class="spinner" id="spin" style="display:none"></span> Generate Chart
    </button>
    <button class="btn btn-gold" onclick="loadFull()">Full ASTRO_OS Chart</button>
    <button class="btn btn-cyan btn-sm" onclick="location.href='/divisional'">→ Divisionals</button>
  </div>
  <div id="errBox"></div>
</div>

<div id="results" style="display:none">
  <div class="grid2">
    <div class="card">
      <h2>🪐 Planetary Positions</h2>
      <div id="planetTable"></div>
    </div>
    <div class="card">
      <h2>✨ Yogas</h2>
      <div id="yogaList"></div>
    </div>
  </div>
  <div class="grid2">
    <div class="card">
      <h2>⚡ Doshas</h2>
      <div id="doshaList"></div>
    </div>
    <div class="card">
      <h2>🧠 AI Interpretation</h2>
      <div id="aiBox"></div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
const PS={'Sun':'☀','Moon':'🌙','Mars':'♂','Mercury':'☿','Jupiter':'♃','Venus':'♀','Saturn':'♄','Rahu':'☊','Ketu':'☋','Lagna':'↑'};

function getPayload(){
  return{date:document.getElementById('date').value,
    time:document.getElementById('time').value+':00',
    place:document.getElementById('place').value,
    latitude:+document.getElementById('latitude').value,
    longitude:+document.getElementById('longitude').value,
    timezone:+document.getElementById('timezone').value};
}

async function calculate(){
  const sp=document.getElementById('spin'); sp.style.display='inline-block';
  document.getElementById('errBox').innerHTML='';
  const d=await api('/api/horoscope',getPayload());
  sp.style.display='none';
  if(d.error){document.getElementById('errBox').innerHTML=`<div class="alert alert-err">⚠ ${d.error}</div>`;return;}
  render(d);
}

async function loadFull(){
  const sp=document.getElementById('spin'); sp.style.display='inline-block';
  document.getElementById('errBox').innerHTML='';
  const d=await api('/api/chart/full',getPayload());
  sp.style.display='none';
  if(d.error){document.getElementById('errBox').innerHTML=`<div class="alert alert-err">⚠ ${d.error}</div>`;return;}
  render(d);
  if(d.vargas){
    const keys=Object.keys(d.vargas).slice(0,4);
    let html='<div class="card"><h2>📊 Sample Vargas (D1–D12)</h2><div class="grid4">';
    keys.forEach(v=>{
      html+=`<div><h3>${v}</h3><table>`;
      Object.entries(d.vargas[v]||{}).slice(0,5).forEach(([p,info])=>{
        html+=`<tr><td>${PS[p]||''} ${p}</td><td class="badge badge-info">${info.sign}</td></tr>`;
      });
      html+=`</table></div>`;
    });
    html+='</div></div>';
    document.getElementById('results').insertAdjacentHTML('beforeend',html);
  }
}

function render(d){
  document.getElementById('planetTable').innerHTML=`<table>
    <tr><th>Planet</th><th>Sign</th><th>House</th><th>Lon°</th></tr>
    ${(d.planets||[]).map(p=>`<tr>
      <td>${PS[p.name]||''} <b>${p.name}</b></td>
      <td><span class="badge badge-info">${p.sign}</span></td>
      <td>${p.house}</td>
      <td>${(p.lon_in_sign||0).toFixed(2)}</td>
    </tr>`).join('')}
  </table>`;

  const yl=document.getElementById('yogaList');
  if(d.yogas&&d.yogas.length){
    yl.innerHTML=d.yogas.map(y=>`
      <div style="border-bottom:1px solid var(--border);padding:.4rem 0">
        <div style="font-weight:600;color:var(--ok)">${y.name}</div>
        <div style="font-size:.78rem;color:var(--muted)">${y.description}</div>
      </div>`).join('');
  } else {
    yl.innerHTML='<div class="alert alert-info">No special yogas found.</div>';
  }

  const dl=document.getElementById('doshaList');
  const doshas=d.doshas||{};
  dl.innerHTML=Object.keys(doshas).length
    ? Object.entries(doshas).map(([k,v])=>`
        <div class="panch-item">
          <div class="label">${k}</div>
          <div class="value">${JSON.stringify(v)}</div>
        </div>`).join('')
    : '<div class="alert alert-info">No dosha data available.</div>';

  const ai=d.interpretation||{};
  document.getElementById('aiBox').innerHTML=ai.summary
    ? `<div class="panch-item"><div class="label">Summary</div><div class="value">${ai.summary}</div></div>
       <div class="panch-item"><div class="label">Focus</div><div class="value">${ai.focus}</div></div>`
    : '<div style="color:var(--muted);font-size:.82rem">AI engine not available.</div>';

  document.getElementById('results').style.display='block';
}
</script>
{% endblock %}
