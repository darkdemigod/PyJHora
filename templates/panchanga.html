{% extends "base.html" %}
{% block title %}Panchanga — PyJHora{% endblock %}
{% block content %}
<h1>📅 Daily Panchanga</h1>

<div class="card">
  <h2>Birth / Query Details</h2>
  <div class="form-grid">
    <div><label>Date</label><input type="date" id="date" value="1997-10-03"></div>
    <div><label>Time</label><input type="time" id="time" value="11:40"></div>
    <div><label>Place</label><input type="text" id="place" value="Jaipur,IN"></div>
    <div><label>Latitude</label><input type="number" id="latitude" value="26.9124" step="0.0001"></div>
    <div><label>Longitude</label><input type="number" id="longitude" value="75.7873" step="0.0001"></div>
    <div><label>Timezone (hrs)</label><input type="number" id="timezone" value="5.5" step="0.5"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="calculate()">
      <span class="spinner" id="spin" style="display:none"></span> Calculate Panchanga
    </button>
    <button class="btn btn-cyan" onclick="useToday()">Use Today</button>
  </div>
  <div id="errBox"></div>
</div>

<div id="results" style="display:none">
  <div class="card">
    <h2>📿 Panchanga Results</h2>
    <div class="panch-grid" id="panchangaGrid"></div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function useToday(){
  const t=new Date();
  document.getElementById('date').value=t.toISOString().slice(0,10);
  document.getElementById('time').value=t.toTimeString().slice(0,5);
}

async function calculate(){
  const sp=document.getElementById('spin'); sp.style.display='inline-block';
  document.getElementById('errBox').innerHTML='';
  document.getElementById('results').style.display='none';

  const payload={
    date:document.getElementById('date').value,
    time:document.getElementById('time').value+':00',
    place:document.getElementById('place').value,
    latitude:+document.getElementById('latitude').value,
    longitude:+document.getElementById('longitude').value,
    timezone:+document.getElementById('timezone').value
  };

  const d=await api('/api/panchanga',payload);
  sp.style.display='none';

  if(d.error){document.getElementById('errBox').innerHTML=`<div class="alert alert-err">⚠ ${d.error}</div>`;return;}

  const items=[
    ['📍 Place','place'],['📅 Date','date'],['🕐 Time','time'],
    ['☀ Day','vaara'],['🌅 Sunrise','sunrise'],['🌇 Sunset','sunset'],
    ['🌕 Moonrise','moonrise'],['🌑 Moonset','moonset'],
    ['🌙 Tithi','tithi'],['⭐ Nakshatra','nakshatra'],
    ['🔯 Yoga','yoga'],['☯ Karana','karana'],['♈ Rasi','rasi']
  ];

  document.getElementById('panchangaGrid').innerHTML=items.map(([label,key])=>`
    <div class="panch-item">
      <div class="label">${label}</div>
      <div class="value">${d[key]||'N/A'}</div>
    </div>`).join('');

  document.getElementById('results').style.display='block';
}
</script>
{% endblock %}
